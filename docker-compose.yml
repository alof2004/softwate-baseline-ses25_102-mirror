services:
  db:
    image: postgres:16-alpine
    container_name: clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # DB port is NOT exposed on the host — backend connects via internal Docker network only.
    # Uncomment only for local debugging.
    # ports:
    #   - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: clinic-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      KEYCLOAK_JWKS_URI: ${KEYCLOAK_JWKS_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      # Backend receives the real client IP forwarded by the WAF
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    # Backend is NOT exposed on the host — all traffic must go through the WAF.
    # Uncomment the lines below only for local debugging without WAF.
    # ports:
    #   - "${BACKEND_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    container_name: clinic-waf
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND: http://backend:8080
      PORT: "8080"
      SSL_PORT: "8443"
      SSL_CERT_FILE: /etc/nginx/conf/server.crt
      SSL_CERT_KEY_FILE: /etc/nginx/conf/server.key
      SSL_PROTOCOLS: TLSv1.2 TLSv1.3
      SSL_CIPHERS: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
      SSL_PREFER_CIPHERS: "off"
      SSL_OCSP_STAPLING: "off"
      CLIENT_MAX_BODY_SIZE: 1m
      SERVER_NAME: localhost
      NGINX_ALWAYS_TLS_REDIRECT: "off"
      METRICS_ALLOW_FROM: "127.0.0.1"
      METRICS_DENY_FROM: "all"
      ALLOWED_METHODS: "GET HEAD POST PUT DELETE OPTIONS"
    volumes:
      - ./certs/localhost+1.pem:/etc/nginx/conf/server.crt:ro
      - ./certs/localhost+1-key.pem:/etc/nginx/conf/server.key:ro
    ports:
      - "${WAF_HTTP_PORT}:8080"
      - "${WAF_HTTPS_PORT}:8443"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
    container_name: clinic-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: clinic-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: INFO
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  pgdata:
