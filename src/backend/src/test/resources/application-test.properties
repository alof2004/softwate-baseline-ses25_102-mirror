spring.datasource.url=jdbc:h2:mem:clinic_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWKS is fetched lazily; providing a placeholder keeps Spring Boot happy without Keycloak running
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/clinic/protocol/openid-connect/certs
keycloak.issuer-uri=http://localhost:8180/realms/clinic
