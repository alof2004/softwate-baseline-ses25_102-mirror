# Role-based permission matrix — roles as data (RBAC explicit authorization layer)
# Each role lists allowed actions per resource. Controllers enforce via @PreAuthorize.
clinic:
  permissions:
    ADMIN:
      patients:     [READ, CREATE, UPDATE, DELETE]
      appointments: [READ, CREATE, UPDATE, DELETE]
    DOCTOR:
      patients:     [READ, UPDATE]
      appointments: [READ, UPDATE]
    RECEPTIONIST:
      patients:     [READ, CREATE]
      appointments: [READ, CREATE, UPDATE, DELETE]
