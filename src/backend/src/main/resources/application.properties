spring.application.name=clinicProject
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clinic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clinic_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable auto-generated security password (SecurityConfig provides the filter chain)
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# API8: suppress stack traces and internal error details
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# API8: suppress Tomcat Server response header
server.server-header=

# API3: reject unknown fields in request bodies (mass-assignment hardening)
spring.jackson.deserialization.fail-on-unknown-properties=true

# API9: OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# API4: request-size limits at app level
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.max-file-size=1MB

# CORS: allowed origins — overridden in docker-compose when WAF is in front
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Auth: validate incoming JWT against Keycloak's JWKS (RS256)
# KEYCLOAK_JWKS_URI overridden in docker-compose to use internal container hostname
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/clinic/protocol/openid-connect/certs}
# Issuer must match the `iss` claim in tokens issued to the browser (external URL)
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/clinic}
