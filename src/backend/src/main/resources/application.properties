spring.application.name=clinicProject
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinic_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clinic_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clinic_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API8: suppress stack traces and internal error details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# API8: suppress Tomcat Server response header
server.server-header=

# API3: reject unknown fields in request bodies (mass-assignment hardening)
spring.jackson.deserialization.fail-on-unknown-properties=true

# API9: OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
