load_module modules/ngx_http_modsecurity_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" modsec="$upstream_http_x_modsec_rule"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    server_tokens   off;   # suppress Nginx version in Server header

    # ── IP-based rate limiting ─────────────────────────────────────────────────
    # 30 req/s per IP with a burst of 60 (allows short legitimate spikes).
    # The application-layer Bucket4j limit (100 req/min ≈ 1.67 req/s) is
    # intentionally looser — the perimeter catches bulk floods first.
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # ── TLS ────────────────────────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── ModSecurity ────────────────────────────────────────────────────────────
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/modsecurity.conf;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS reverse proxy ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # ── Request size limits ───────────────────────────────────────────────
        client_max_body_size    1m;
        client_body_timeout     10s;
        client_header_timeout   10s;

        # ── Security response headers ─────────────────────────────────────────
        # These complement the headers already set by Spring Security.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        # ── /api/** → Spring Boot backend ────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts — prevent slow-loris and unbounded upstream waits
            proxy_connect_timeout 5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    30s;
        }

        # ── /v3/api-docs + /swagger-ui → Spring Boot (no rate limit) ─────────
        location ~ ^/(v3/api-docs|swagger-ui) {
            proxy_pass         http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Deny everything else ──────────────────────────────────────────────
        location / {
            return 404;
        }
    }
}
