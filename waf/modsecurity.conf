# ── ModSecurity engine ─────────────────────────────────────────────────────────
SecRuleEngine On

# ── Request body handling ──────────────────────────────────────────────────────
SecRequestBodyAccess On
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyLimitAction Reject

# ── Response body handling ─────────────────────────────────────────────────────
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html application/json
SecResponseBodyLimit 524288
SecResponseBodyLimitAction ProcessPartial

# ── Tmp/upload dirs ────────────────────────────────────────────────────────────
SecTmpDir   /tmp/
SecDataDir  /tmp/

# ── Audit logging ──────────────────────────────────────────────────────────────
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog     /var/log/modsec_audit.log
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial

# ── Debug (set to 0 in production) ────────────────────────────────────────────
SecDebugLog      /var/log/modsec_debug.log
SecDebugLogLevel 0

# ── Default action: block + log ────────────────────────────────────────────────
SecDefaultAction "phase:1,log,auditlog,deny,status:403"
SecDefaultAction "phase:2,log,auditlog,deny,status:403"

# ── Component header (helps identify WAF in audit logs) ────────────────────────
SecComponentSignature "ClinicWAF/1.0"

# ── OWASP CRS ─────────────────────────────────────────────────────────────────
# Include the CRS setup file and all rules.
# The base image (owasp/modsecurity-crs:nginx-alpine) ships CRS at:
#   /etc/modsecurity.d/owasp-crs/
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# ── Per-application tuning (false-positive exclusions) ────────────────────────
# Applied AFTER CRS rules so exclusions take precedence.
Include /etc/nginx/modsec/crs-setup.d/*.conf
