# ── CRS Tuning — Clinic Management API ────────────────────────────────────────
#
# This file contains per-application false-positive exclusions for the OWASP
# Core Rule Set (CRS) blocking mode. Each exclusion is documented with:
#   - the rule ID(s) being excluded
#   - the reason (legitimate traffic pattern that triggers the rule)
#   - the scope (URI + parameter where the exclusion applies)
#
# Rules are applied after the CRS include in modsecurity.conf.
# ──────────────────────────────────────────────────────────────────────────────

# ── Paranoia Level ────────────────────────────────────────────────────────────
# PL1 (default) — matches the threat model for a clinic REST API. PL2+ would
# generate excessive false positives on ISO date strings and JSON payloads.
SecAction \
    "id:900000, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:tx.paranoia_level=1"

SecAction \
    "id:900001, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:tx.enforced_paranoia_level=1"

# ── Anomaly scoring thresholds ────────────────────────────────────────────────
# Inbound threshold 5 = block after a single HIGH (score 5) or two MEDIUM hits.
# Outbound threshold 4 = block responses leaking error detail.
SecAction \
    "id:900110, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:tx.inbound_anomaly_score_threshold=5, \
    setvar:tx.outbound_anomaly_score_threshold=4"

# ── Rule 920420 — Content-Type not in allowed list ────────────────────────────
# Reason: Spring Boot returns application/json; charset=UTF-8 for some error
# responses. The CRS default list requires exact match without charset parameter.
# Scope: all responses from /api/**
SecRuleUpdateTargetById 920420 "!REQUEST_HEADERS:Content-Type"
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:9200001, \
    phase:1, \
    pass, \
    nolog, \
    t:none, \
    ctl:ruleRemoveById=920420"

# ── Rule 942100 — SQL injection (libinjection) ────────────────────────────────
# Reason: the ?patientName= and ?specialty= query parameters accept free-text
# strings (e.g. "O'Brien", "Cardio-Thoracic"). libinjection scores these as
# potential SQLi. The application uses JPA parameterised queries — no raw SQL.
# Scope: GET query parameters on /api/appointments and /api/patients
SecRule REQUEST_URI "@rx ^/api/(patients|appointments)" \
    "id:9200002, \
    phase:1, \
    pass, \
    nolog, \
    t:none, \
    ctl:ruleRemoveTargetById=942100;ARGS:patientName, \
    ctl:ruleRemoveTargetById=942100;ARGS:specialty, \
    ctl:ruleRemoveTargetById=942100;ARGS:status"

# ── Rule 942440 — SQL comment sequence ────────────────────────────────────────
# Reason: appointment specialty values such as "Cardio--thoracic" contain
# double-dash sequences that CRS flags as SQL comment markers.
# Scope: specialty field in POST/PUT request bodies
SecRule REQUEST_URI "@rx ^/api/appointments" \
    "id:9200003, \
    phase:2, \
    pass, \
    nolog, \
    t:none, \
    ctl:ruleRemoveTargetById=942440;ARGS:specialty"

# ── Rule 920230 — Multiple URL encoding ───────────────────────────────────────
# Reason: ISO 8601 datetime strings submitted as JSON (%3A = ':') can trigger
# double-encoding detection when sent via some HTTP clients.
# Scope: dateTime field in appointment request bodies
SecRule REQUEST_URI "@beginsWith /api/appointments" \
    "id:9200004, \
    phase:2, \
    pass, \
    nolog, \
    t:none, \
    ctl:ruleRemoveTargetById=920230;ARGS:dateTime"

# ── Rule 921110 — HTTP request smuggling ─────────────────────────────────────
# No exclusion needed — the proxy_http_version 1.1 directive in nginx.conf and
# the single-connection backend model prevent smuggling. Rule kept active.

# ── Rule 949110 — Inbound anomaly score exceeded ─────────────────────────────
# No exclusion — this is the final blocking rule; exclusions above prevent
# legitimate traffic from accumulating score.
