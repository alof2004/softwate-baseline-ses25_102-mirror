# ── CRS Tuning — Clinic Management API (pre-CRS variables) ────────────────────
#
# This file is loaded BEFORE crs-setup.conf and the CRS rules.
# Only tx.* variable assignments belong here.
# Rule exclusions (ctl:ruleRemove*) are in 02-clinic-rule-exclusions.conf
# which is loaded after the rules.
# ──────────────────────────────────────────────────────────────────────────────

# ── Paranoia Level ────────────────────────────────────────────────────────────
SecAction \
    "id:900000, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:tx.paranoia_level=1"

SecAction \
    "id:900001, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:tx.enforced_paranoia_level=1"

# ── Anomaly scoring thresholds ────────────────────────────────────────────────
SecAction \
    "id:900110, \
    phase:1, \
    nolog, \
    pass, \
    t:none, \
    setvar:tx.inbound_anomaly_score_threshold=5, \
    setvar:tx.outbound_anomaly_score_threshold=4"

# ── Allowed HTTP methods (rule 911100) ───────────────────────────────────────
# PUT and DELETE are allowed via the ALLOWED_METHODS env var in docker-compose,
# which the base image entrypoint passes to tx.allowed_methods via SecAction 900200.

