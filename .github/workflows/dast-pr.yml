name: DAST - PR Checks

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: dast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: ZAP scan directly against the backend (no WAF) ──────────────────
  zap-direct:
    name: OWASP ZAP — Direct (no WAF)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create dast-network

      - name: Start PostgreSQL database
        run: |
          docker run -d \
            --name postgres \
            --network dast-network \
            -e POSTGRES_DB=clinic_db \
            -e POSTGRES_USER=clinic_user \
            -e POSTGRES_PASSWORD=clinic_pass \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec postgres pg_isready -U clinic_user -d clinic_db >/dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i: PostgreSQL not ready yet, waiting..."
            sleep 2
          done

      - name: Build and start backend
        run: |
          docker build -t clinic-backend:dast ./src/backend
          docker run -d \
            --name backend \
            --network dast-network \
            -p 18080:8080 \
            -e SERVER_PORT=8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/clinic_db \
            -e SPRING_DATASOURCE_USERNAME=clinic_user \
            -e SPRING_DATASOURCE_PASSWORD=clinic_pass \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            -e KEYCLOAK_JWKS_URI=http://localhost:8180/realms/clinic/protocol/openid-connect/certs \
            -e KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/clinic \
            -e CORS_ALLOWED_ORIGINS=http://localhost:15173 \
            clinic-backend:dast

      - name: Build and start frontend
        run: |
          docker build -t clinic-frontend:dast ./src/frontend
          docker run -d \
            --name frontend \
            --network dast-network \
            -p 15173:5173 \
            -e VITE_API_BASE_URL=/api \
            -e VITE_PROXY_TARGET=http://backend:8080 \
            -e VITE_KEYCLOAK_URL=http://localhost:8180 \
            clinic-frontend:dast

      - name: Wait for application to be ready
        run: |
          backend_url="http://localhost:18080/api/patients"
          frontend_url="http://localhost:15173"
          timeout_seconds=240
          start_time="$(date +%s)"

          echo "Waiting for backend at ${backend_url}"
          echo "Waiting for frontend at ${frontend_url}"

          while true; do
            # Backend returns 401 when auth is required — any HTTP response means it's up.
            backend_status=$(curl -s -o /dev/null -w "%{http_code}" "${backend_url}" 2>/dev/null || echo "000")
            frontend_ok=$(curl -fsS "${frontend_url}" >/dev/null 2>&1 && echo "yes" || echo "no")

            if [[ "$backend_status" =~ ^[2-4][0-9][0-9]$ ]] && [ "$frontend_ok" = "yes" ]; then
              echo "Application is reachable (backend: ${backend_status})."
              break
            fi

            now="$(date +%s)"
            if [ $((now - start_time)) -ge "${timeout_seconds}" ]; then
              echo "Timed out waiting for the application to become ready." >&2
              docker logs backend || true
              docker logs frontend || true
              exit 1
            fi

            echo "backend=${backend_status} frontend=${frontend_ok} — retrying in 5s..."
            sleep 5
          done

      - name: Run OWASP ZAP baseline scan (direct)
        run: |
          mkdir -p dast/reports
          chmod 0777 dast/reports

          set +e
          docker run --rm \
            --network dast-network \
            -v "$PWD/dast/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "http://frontend:5173" \
            -a \
            -j \
            -I \
            -m 2 \
            -D 5 \
            -r zap-direct-report.html \
            -J zap-direct-report.json \
            --autooff
          scan_exit_code=$?
          set -e

          echo "ZAP exited with code ${scan_exit_code}."
          if [ ! -f "dast/reports/zap-direct-report.json" ]; then
            echo "ZAP did not produce dast/reports/zap-direct-report.json" >&2
            exit 1
          fi

      - name: Upload DAST direct reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-direct-reports
          path: |
            dast/reports/zap-direct-report.html
            dast/reports/zap-direct-report.json
          if-no-files-found: warn

      - name: Enforce DAST gate (direct)
        if: always()
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary_file="$RUNNER_TEMP/dast-direct-summary.md"

          if [ ! -f "dast/reports/zap-direct-report.json" ]; then
            {
              echo "<!-- dast-pr-comment -->"
              echo "## DAST Scan Summary (Direct)"
              echo "**Gate Status:** Failed. ZAP report was not generated."
            } > "$summary_file"
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 .github/scripts/evaluate_zap_report.py \
            --report dast/reports/zap-direct-report.json \
            --summary-file "$summary_file" \
            --target-ref "$TARGET_REF" \
            --marker "<!-- dast-pr-comment -->" \
            --run-url "$ACTIONS_RUN_URL" \
            --fail-on High

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment DAST direct report on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const upsertPrComment = require('./.github/scripts/upsert_pr_comment');
            await upsertPrComment({
              github,
              context,
              bodyPath: `${process.env.RUNNER_TEMP}/dast-direct-summary.md`,
              marker: '<!-- dast-pr-comment -->',
            });

      - name: Clean up Docker containers
        if: always()
        run: |
          docker stop frontend backend postgres || true
          docker rm frontend backend postgres || true
          docker network rm dast-network || true

  # ── Job 2: ZAP scan through Nginx + ModSecurity WAF ────────────────────────
  zap-via-waf:
    name: OWASP ZAP — Via WAF (Nginx + ModSecurity CRS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create dast-waf-network

      - name: Start PostgreSQL database
        run: |
          docker run -d \
            --name postgres-waf \
            --network dast-waf-network \
            -e POSTGRES_DB=clinic_db \
            -e POSTGRES_USER=clinic_user \
            -e POSTGRES_PASSWORD=clinic_pass \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec postgres-waf pg_isready -U clinic_user -d clinic_db >/dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i: PostgreSQL not ready yet, waiting..."
            sleep 2
          done

      - name: Build and start backend (internal only)
        run: |
          docker build -t clinic-backend:dast-waf ./src/backend
          docker run -d \
            --name backend \
            --network dast-waf-network \
            -e SERVER_PORT=8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-waf:5432/clinic_db \
            -e SPRING_DATASOURCE_USERNAME=clinic_user \
            -e SPRING_DATASOURCE_PASSWORD=clinic_pass \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            -e KEYCLOAK_JWKS_URI=http://localhost:8180/realms/clinic/protocol/openid-connect/certs \
            -e KEYCLOAK_ISSUER_URI=http://localhost:8180/realms/clinic \
            -e CORS_ALLOWED_ORIGINS=http://localhost:15174 \
            clinic-backend:dast-waf

          echo "Waiting for backend to start..."
          for i in {1..30}; do
            if docker exec backend curl -sf http://localhost:8080/v3/api-docs >/dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: backend not ready yet, waiting..."
            sleep 3
          done

      - name: Build and start WAF
        run: |
          docker build -t clinic-waf:dast ./waf
          docker run -d \
            --name waf \
            --network dast-waf-network \
            -p 18081:80 \
            -p 18443:443 \
            clinic-waf:dast

      - name: Build and start frontend (proxying via WAF)
        run: |
          docker build -t clinic-frontend:dast-waf ./src/frontend
          docker run -d \
            --name frontend-waf \
            --network dast-waf-network \
            -p 15174:5173 \
            -e VITE_API_BASE_URL=/api \
            -e VITE_PROXY_TARGET=http://waf:80 \
            -e VITE_KEYCLOAK_URL=http://localhost:8180 \
            clinic-frontend:dast-waf

      - name: Wait for WAF + frontend to be ready
        run: |
          waf_url="http://localhost:18081/api/patients"
          frontend_url="http://localhost:15174"
          timeout_seconds=240
          start_time="$(date +%s)"

          echo "Waiting for WAF at ${waf_url} and frontend at ${frontend_url}"

          while true; do
            # WAF returns 401 (auth required) or 403 (CRS block) — either means WAF is up.
            waf_status=$(curl -s -o /dev/null -w "%{http_code}" "${waf_url}" 2>/dev/null || echo "000")
            frontend_ok=$(curl -fsS "${frontend_url}" >/dev/null 2>&1 && echo "yes" || echo "no")

            if [[ "$waf_status" =~ ^[2-4][0-9][0-9]$ ]] && [ "$frontend_ok" = "yes" ]; then
              echo "Stack is reachable (waf: ${waf_status})."
              break
            fi

            now="$(date +%s)"
            if [ $((now - start_time)) -ge "${timeout_seconds}" ]; then
              echo "Timed out waiting for the WAF stack to become ready." >&2
              docker logs waf    || true
              docker logs backend || true
              exit 1
            fi

            echo "waf=${waf_status} frontend=${frontend_ok} — retrying in 5s..."
            sleep 5
          done

      - name: Run OWASP ZAP baseline scan (via WAF)
        run: |
          mkdir -p dast/reports
          chmod 0777 dast/reports

          set +e
          docker run --rm \
            --network dast-waf-network \
            -v "$PWD/dast/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "http://frontend-waf:5173" \
            -a \
            -j \
            -I \
            -m 2 \
            -D 5 \
            -r zap-waf-report.html \
            -J zap-waf-report.json \
            --autooff
          scan_exit_code=$?
          set -e

          echo "ZAP exited with code ${scan_exit_code}."
          if [ ! -f "dast/reports/zap-waf-report.json" ]; then
            echo "ZAP did not produce dast/reports/zap-waf-report.json" >&2
            exit 1
          fi

      - name: Collect WAF ModSecurity audit log
        if: always()
        run: |
          mkdir -p dast/reports
          docker exec waf cat /var/log/modsec_audit.log > dast/reports/modsec-audit.log 2>/dev/null || true
          docker exec waf cat /var/log/nginx/access.log  > dast/reports/nginx-access.log 2>/dev/null || true
          echo "ModSecurity blocks during scan:"
          grep -c "action=intercepted" dast/reports/modsec-audit.log || echo "0 blocks"

      - name: Upload DAST WAF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-waf-reports
          path: |
            dast/reports/zap-waf-report.html
            dast/reports/zap-waf-report.json
            dast/reports/modsec-audit.log
            dast/reports/nginx-access.log
          if-no-files-found: warn

      - name: Enforce DAST gate (via WAF)
        if: always()
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary_file="$RUNNER_TEMP/dast-waf-summary.md"

          if [ ! -f "dast/reports/zap-waf-report.json" ]; then
            {
              echo "<!-- dast-waf-comment -->"
              echo "## DAST Scan Summary (Via WAF)"
              echo "**Gate Status:** Failed. ZAP report was not generated."
            } > "$summary_file"
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 .github/scripts/evaluate_zap_report.py \
            --report dast/reports/zap-waf-report.json \
            --summary-file "$summary_file" \
            --target-ref "$TARGET_REF" \
            --marker "<!-- dast-waf-comment -->" \
            --run-url "$ACTIONS_RUN_URL" \
            --fail-on High

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment DAST WAF report on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const upsertPrComment = require('./.github/scripts/upsert_pr_comment');
            await upsertPrComment({
              github,
              context,
              bodyPath: `${process.env.RUNNER_TEMP}/dast-waf-summary.md`,
              marker: '<!-- dast-waf-comment -->',
            });

      - name: Clean up Docker containers
        if: always()
        run: |
          docker stop frontend-waf waf backend postgres-waf || true
          docker rm  frontend-waf waf backend postgres-waf || true
          docker network rm dast-waf-network || true
